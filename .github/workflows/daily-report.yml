name: Daily Stock Report

on:
  schedule:
    - cron: "5 23 * * 1-5"   # 23:05 UTC จ-ศ = 06:05 ICT อ-ส (เข้าคิว ~6 โมง; GitHub ยิงจริงเมื่อ runner ว่าง)
  workflow_dispatch: {}        # ปุ่มรันมือทดสอบ

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
